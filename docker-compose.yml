services:

  fastapi:

    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile

    container_name: fastapi

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    restart: always

    depends_on:
      - rabbitmq

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  rabbitmq:

    image: rabbitmq:3.13-management

    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    restart: always

  worker:

    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile

    container_name: worker

    volumes:
      - .:/app

    depends_on:
      - rabbitmq

    command: python app/worker.py

    restart: always

    healthcheck:
      test: ["CMD", "nc", "-z", "rabbitmq", "5672"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s