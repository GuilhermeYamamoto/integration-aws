services:

  fastapi:

    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile

    container_name: fastapi

    ports:
      # Só acessível pela própria máquina; de fora, o acesso é pelo Caddy (HTTPS)
      - "127.0.0.1:8000:8000"

    volumes:
      - .:/app

    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

    restart: always

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      # A imagem slim não tem curl; usamos o próprio Python (falha se /health devolver erro)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  rabbitmq:

    image: rabbitmq:3.13-management

    container_name: rabbitmq

    # Nome fixo: o RabbitMQ guarda os dados numa pasta com o nome do host
    hostname: rabbitmq

    ports:
      # 127.0.0.1 = não expor para a internet (o Docker ignora o firewall ufw)
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      # Volume nomeado: filas e mensagens sobrevivem a `docker compose down`
      - rabbitmq_data:/var/lib/rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

    restart: always

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  worker:

    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile

    container_name: worker

    volumes:
      - .:/app

    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      ODOO_WEBHOOK_URL: ${ODOO_WEBHOOK_URL:-}
      ODOO_TIMEOUT_SECONDS: ${ODOO_TIMEOUT_SECONDS:-30}
      ODOO_MAX_RETRIES: ${ODOO_MAX_RETRIES:-5}

    depends_on:
      rabbitmq:
        condition: service_healthy

    # -m roda como módulo, para os imports `app.core...` funcionarem igual à API
    command: python -m app.worker

    restart: always

    healthcheck:
      # A imagem slim não tem nc; checa se a porta do RabbitMQ responde usando Python
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('rabbitmq', 5672), timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:

    # Só sobe com `--profile prod`: no servidor, recebe HTTPS e repassa ao FastAPI
    profiles: ["prod"]

    image: caddy:2

    container_name: caddy

    ports:
      - "80:80"
      - "443:443"

    environment:
      DOMAIN: ${DOMAIN:-localhost}

    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados HTTPS ficam aqui (evita pedir de novo a cada restart)
      - caddy_data:/data

    restart: always

    depends_on:
      - fastapi

volumes:
  rabbitmq_data:
  caddy_data:
