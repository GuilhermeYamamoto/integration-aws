services:

  fastapi:

    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile

    container_name: fastapi

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

    restart: always

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      # A imagem slim não tem curl; usamos o próprio Python (falha se /health devolver erro)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  rabbitmq:

    image: rabbitmq:3.13-management

    container_name: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

    restart: always

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  worker:

    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile

    container_name: worker

    volumes:
      - .:/app

    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

    depends_on:
      rabbitmq:
        condition: service_healthy

    # -m roda como módulo, para os imports `app.core...` funcionarem igual à API
    command: python -m app.worker

    restart: always

    healthcheck:
      # A imagem slim não tem nc; checa se a porta do RabbitMQ responde usando Python
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('rabbitmq', 5672), timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
